<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Grid pattern overlay for map abstraction */
        .map-pattern {
            background-color: #f4f3f7; /* surface-container-low */
            background-image: linear-gradient(#e3e2e6 1px, transparent 1px), linear-gradient(90deg, #e3e2e6 1px, transparent 1px);
            background-size: 40px 40px;
        }

<body class="bg-background text-on-surface font-body-md text-body-md overflow-hidden h-screen w-screen flex">
<!-- SideNavBar (Shared Component) -->
<nav class="fixed left-0 top-0 h-full w-[360px] bg-surface border-r border-border-subtle flex flex-col py-6 z-40">
<!-- Header -->
<div class="px-6 pb-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-headline-md text-headline-md">
                    GA
                </div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">GeoTravel GIS</h1>
<p class="font-label-md text-label-md text-on-surface-variant">Management Portal</p>
</div>
</div>
</div>
<!-- Main Navigation -->
<ul class="flex flex-col flex-grow">
<!-- Dashboard (Inactive) -->
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
</li>
<!-- Zones (Active) -->
<li>
<a class="flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-r-full border-l-4 border-primary hover:bg-surface-container-high transition-colors duration-200" href="#" style="transform: scale(0.98); transition: transform 150ms;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-md text-label-md">Zones</span>
</a>
</li>
<!-- Routes (Inactive) -->
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">route</span>
<span class="font-label-md text-label-md">Routes</span>
</a>
</li>
<!-- Attractions (Inactive) -->
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">photo_library</span>
<span class="font-label-md text-label-md">Attractions</span>
</a>
</li>
<!-- Guest Portal (Inactive) -->
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-md text-label-md">Guest Portal</span>
</a>
</li>
</ul>
<!-- CTA -->
<div class="px-4 py-6">
<button class="w-full bg-primary text-on-primary py-2 px-4 rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                New Project
            </button>
</div>
<!-- Footer Navigation -->
<ul class="flex flex-col mt-auto pt-4 border-t border-outline-variant">
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors duration-200" href="#">
<span class="material-symbols-outlined">help_center</span>
<span class="font-label-md text-label-md">Support</span>
</a>
</li>
</ul>

<!-- Main Content Canvas (Map Area) -->
<main class="ml-[360px] flex-grow relative h-full bg-surface-dim map-pattern" data-location="Punta del Este, Uruguay">
<!-- TopAppBar (Shared Component) -->
<div class="fixed top-4 right-4 left-[376px] rounded-xl border border-border-subtle bg-map-overlay-bg backdrop-blur-md shadow-md flex justify-between items-center px-6 h-16 z-50">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-black text-primary">GeoTravel GIS</span>
</div>
<div class="flex items-center gap-6">
<!-- Search -->
<div class="relative focus-within:ring-2 focus-within:ring-primary rounded-lg overflow-hidden border border-outline bg-surface-container-lowest">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
<input class="pl-10 pr-4 py-2 bg-transparent border-none focus:outline-none focus:ring-0 font-body-md text-body-md text-on-surface w-64" placeholder="Search coordinates or zones..." type="text"/>
</div>
<!-- Trailing Actions -->
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</div>
</div>
<!-- Simulated Map Content (Polygons) -->
<div class="absolute inset-0 z-10 pointer-events-none">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<!-- Existing Zone -->
<polygon class="pointer-events-auto cursor-pointer hover:fill-opacity-40 transition-all" fill="rgba(10, 108, 68, 0.2)" points="200,150 400,200 350,400 150,350" stroke="#0a6c44" stroke-width="2"></polygon>
<!-- Selected/Editing Zone -->
<polygon class="pointer-events-auto cursor-pointer" fill="rgba(0, 32, 69, 0.3)" points="600,300 800,250 850,450 650,500" stroke="#002045" stroke-dasharray="4" stroke-width="2"></polygon>
<!-- Vertex Markers for Editing -->
<circle class="pointer-events-auto cursor-move" cx="600" cy="300" fill="#ffffff" r="4" stroke="#002045" stroke-width="2"></circle>
<circle class="pointer-events-auto cursor-move" cx="800" cy="250" fill="#ffffff" r="4" stroke="#002045" stroke-width="2"></circle>
<circle class="pointer-events-auto cursor-move" cx="850" cy="450" fill="#ffffff" r="4" stroke="#002045" stroke-width="2"></circle>
<circle class="pointer-events-auto cursor-move" cx="650" cy="500" fill="#ffffff" r="4" stroke="#002045" stroke-width="2"></circle>
</svg>
</div>
<!-- Floating Map Controls (Surface 2) - Drawing Toolbar -->
<div class="absolute top-28 left-6 z-30 bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.1)] p-2 border border-outline-variant flex flex-col gap-2">
<!-- Select Tool (Active) -->
<button class="w-10 h-10 rounded-lg bg-primary-container text-primary flex items-center justify-center relative group" title="Select">
<span class="material-symbols-outlined">arrow_selector_tool</span>
<!-- Tooltip -->
<div class="absolute left-full ml-2 px-2 py-1 bg-inverse-surface text-inverse-on-surface font-label-md text-label-md rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Select</div>
</button>
<!-- Draw Polygon Tool -->
<button class="w-10 h-10 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-primary flex items-center justify-center transition-colors relative group" title="Draw Polygon">
<span class="material-symbols-outlined">draw</span>
<div class="absolute left-full ml-2 px-2 py-1 bg-inverse-surface text-inverse-on-surface font-label-md text-label-md rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Draw Polygon</div>
</button>
<!-- Edit Tool -->
<button class="w-10 h-10 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-primary flex items-center justify-center transition-colors relative group" title="Edit Geometry">
<span class="material-symbols-outlined">edit</span>
<div class="absolute left-full ml-2 px-2 py-1 bg-inverse-surface text-inverse-on-surface font-label-md text-label-md rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Edit</div>
</button>
<div class="w-full h-px bg-outline-variant my-1"></div>
<!-- Delete Tool -->
<button class="w-10 h-10 rounded-lg text-on-surface-variant hover:bg-error-container hover:text-error flex items-center justify-center transition-colors relative group" title="Delete Zone">
<span class="material-symbols-outlined">delete</span>
<div class="absolute left-full ml-2 px-2 py-1 bg-inverse-surface text-inverse-on-surface font-label-md text-label-md rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">Delete</div>
</button>
</div>
<!-- Right Collapsible Sidebar (Zone Details - Surface 1) -->
<aside class="absolute top-0 right-0 h-full w-[360px] bg-surface-container-lowest border-l border-outline-variant z-40 shadow-lg flex flex-col transform transition-transform duration-300 translate-x-0">
<!-- Header -->
<div class="px-6 py-5 border-b border-outline-variant flex items-center justify-between bg-surface-bright">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Zone Details</h2>
<p class="font-label-md text-label-md text-on-surface-variant mt-1">Editing Polygon ID: 8A42</p>
</div>
<button class="text-on-surface-variant hover:text-primary p-1 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Form Content -->
<div class="p-6 flex-grow overflow-y-auto flex flex-col gap-6">
<!-- Field: Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="zone_name">Zone Name</label>
<input class="px-3 py-2 border border-outline rounded-lg bg-transparent font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="zone_name" type="text" value="Coastal Heritage District"/>
</div>
<!-- Field: Description -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="zone_desc">Description</label>
<textarea class="px-3 py-2 border border-outline rounded-lg bg-transparent font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="zone_desc" rows="3">High-traffic area containing colonial architecture and major seafood gastronomy points.</textarea>
</div>
<!-- Field: Attraction Level -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Attraction Level</label>
<div class="flex gap-2">
<!-- Rating 1-5 -->
<label class="cursor-pointer">
<input class="sr-only peer" name="attraction_level" type="radio" value="1"/>
<div class="w-10 h-10 rounded border border-outline flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary hover:bg-surface-container transition-colors">1</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="attraction_level" type="radio" value="2"/>
<div class="w-10 h-10 rounded border border-outline flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary hover:bg-surface-container transition-colors">2</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="attraction_level" type="radio" value="3"/>
<div class="w-10 h-10 rounded border border-outline flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary hover:bg-surface-container transition-colors">3</div>
</label>
<label class="cursor-pointer">
<input checked="" class="sr-only peer" name="attraction_level" type="radio" value="4"/>
<div class="w-10 h-10 rounded border border-outline flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary hover:bg-surface-container transition-colors">4</div>
</label>
<label class="cursor-pointer">
<input class="sr-only peer" name="attraction_level" type="radio" value="5"/>
<div class="w-10 h-10 rounded border border-outline flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary hover:bg-surface-container transition-colors">5</div>
</label>
</div>
</div>
<!-- Field: Observations -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="zone_obs">Internal Observations</label>
<textarea class="px-3 py-2 border border-outline rounded-lg bg-surface-container-low font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none placeholder:text-outline" id="zone_obs" placeholder="Enter notes for administrative staff only..." rows="4"></textarea>
</div>
<!-- Status Chip Example inside form to match style guide -->
<div class="flex items-center gap-3 py-2 border-t border-outline-variant mt-2">
<span class="font-label-md text-label-md text-on-surface">Current Status:</span>
<span class="px-3 py-1 rounded-full bg-secondary-fixed-dim text-on-secondary-fixed-variant font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                        Active Zone
                    </span>
</div>
</div>
<!-- Footer Actions -->
<div class="p-4 border-t border-outline-variant bg-surface-bright flex justify-end gap-3">
<button class="px-4 py-2 rounded-lg border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">
                    Discard Changes
                </button>
<button class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Zone
                </button>
</div>
</aside>
