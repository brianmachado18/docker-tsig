server:
  port: 8080

spring:
  application:
    name: tsig-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tsig}
    username: ${SPRING_DATASOURCE_USERNAME:tsig}
    password: ${SPRING_DATASOURCE_PASSWORD:tsig}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

geoserver:
  url: ${GEOSERVER_URL:http://localhost:8081/geoserver}

geocoding:
  nominatim:
    url: ${GEOCODING_NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:GeoTravel/1.0 (tsig local project)}

recorrido:
  busqueda:
    interseccion:
      umbral-metros: ${RECORRIDO_BUSQUEDA_INTERSECCION_UMBRAL_METROS:1000}
