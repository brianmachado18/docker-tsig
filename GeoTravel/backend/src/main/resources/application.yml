server:
  port: 8080

spring:
  application:
    name: tsig-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tsig}
    username: ${SPRING_DATASOURCE_USERNAME:tsig}
    password: ${SPRING_DATASOURCE_PASSWORD:tsig}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

geoserver:
  url: ${GEOSERVER_URL:http://localhost:8081/geoserver}

geocoding:
  ide:
    base-url: ${GEOCODING_IDE_BASE_URL:https://direcciones.ide.uy}
    user-agent: ${GEOCODING_IDE_USER_AGENT:${GEOCODING_USER_AGENT:GeoTravel/1.0 (tsig local project)}}
    request-timeout-ms: ${GEOCODING_IDE_REQUEST_TIMEOUT_MS:10000}
    insecure: ${GEOCODING_IDE_INSECURE:true}
